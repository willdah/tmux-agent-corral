# The README demo's tmux: stock bindings, a plain status bar, and the
# README's snippet. demo/setup runs it with HOME pointing at a temp dir where
# ~/.config/tmux/agents links to this checkout.
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal tmux-256color
set -g escape-time 0

source-file ~/.config/tmux/agents/agents.tmux
set -g @agents_group on

set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[bold] #S #[nobold] "
set -g status-left-length 20
set -g status-right "#{E:@agents_status} "
setw -g window-status-format         " #I:#W#{E:@agent_tab} "
setw -g window-status-current-format "#[bg=colour238,fg=colour255] #I:#W#{E:@agent_tab} "
set -g pane-border-style        fg=colour238
set -g pane-active-border-style fg=colour110

# The staged agents start their clock when the recording's client attaches.
set-hook -g client-attached 'wait-for -S corral-demo-go'
