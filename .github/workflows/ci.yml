name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tmux and fzf
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tmux fzf
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq tmux
            # apt's fzf is older than the 0.71 the panel needs.
            v=0.74.4
            curl -fsSL "https://github.com/junegunn/fzf/releases/download/v$v/fzf-$v-linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin
          fi
          tmux -V; fzf --version; jq --version
      - run: ./smoke-test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning $(git grep -lE '^#!/usr/bin/env bash' -- ':!*.md')
      - name: JSON
        run: jq empty copilot-hooks.json

  # release.yml picks the version bump from these prefixes.
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | grep -qE '^(feat|fix|perf|docs|test|refactor|chore|ci|build|style|revert)(\([^)]+\))?!?: .+' ||
            { echo "::error::PR title '$TITLE' is not a conventional commit (e.g. 'fix: ...', 'feat(panel)!: ...')"; exit 1; }
