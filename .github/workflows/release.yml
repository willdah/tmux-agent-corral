name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bump from the conventional commits since the last tag: a breaking
          # change is major, feat minor, fix/perf patch; anything else (docs,
          # test, ci...) releases nothing. Merge commits carry the PR's commits
          # in their bodies, so whole messages are read, not just subjects.
          last="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          msgs="$(git log --format=%B "${last:+$last..}HEAD")"
          if   grep -qE '^[a-z]+(\([^)]+\))?!: |^BREAKING[ -]CHANGE: ' <<<"$msgs"; then bump=major
          elif grep -qE '^feat(\([^)]+\))?: ' <<<"$msgs"; then bump=minor
          elif grep -qE '^(fix|perf)(\([^)]+\))?: ' <<<"$msgs"; then bump=patch
          else echo "nothing to release since ${last:-the start}"; exit 0; fi
          IFS=. read -r major minor patch <<<"${last:-0.0.0}"
          case $bump in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac
          echo "$bump bump: ${last:-none} -> $next"

          # Changelog entry from the same lines the bump read, so whatever
          # released is listed. The commit and its tag push to main together:
          # if main moved meanwhile neither lands, and the run for that newer
          # push releases everything instead.
          section() {
            local lines
            lines="$(grep -E "$2" <<<"$msgs" | sed -E 's/^([a-z]+(\([^)]+\))?!|BREAKING[ -]CHANGE): /- **Breaking:** /; s/^[a-z]+(\([^)]+\))?: /- /' | awk '!seen[$0]++')"
            if [ -n "$lines" ]; then printf '### %s\n\n%s\n\n' "$1" "$lines"; fi
          }
          notes="$(section Added '^feat(\([^)]+\))?: '
                   section Changed '^[a-z]+(\([^)]+\))?!: |^BREAKING[ -]CHANGE: |^perf(\([^)]+\))?: '
                   section Fixed '^fix(\([^)]+\))?: ')"
          url="https://github.com/$GITHUB_REPOSITORY"
          link="${last:+$url/compare/$last...$next}"
          entry="$(printf '%s\n\n' "## [$next](${link:-$url/releases/tag/$next}) - $(date -u +%F)" ${notes:+"$notes"})"
          ENTRY="$entry" awk '/^## / && !done { print ENVIRON["ENTRY"] "\n"; done = 1 } 1' CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          mv "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -qam "chore(release): $next"
          git tag "$next"
          git push -q --atomic origin HEAD:main "$next"
          # The tag is already on main; retry only the API call.
          for _ in 1 2 3; do
            gh release create "$next" --verify-tag --title "$next" --notes "$notes" --generate-notes && exit 0
            sleep 15
          done
          exit 1
