name: Bug report
description: Something in the panel, status line or hooks misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `tmux -V; fzf --version`, your OS, and the agent (Claude Code, Copilot CLI, Pi...)
    validations:
      required: true
